name: Build Content

on:
  push:
    branches: [main]
    paths:
      - 'content-src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build MyST site
        working-directory: content-src
        env:
          BASE_URL: /climate-futures/content
        run: npx -y mystmd build --html

      - name: Sync build output into content/
        run: |
          rm -rf content
          mkdir -p content
          cp -r content-src/_build/html/. content/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild content site"
            git push
          fi
