# Data for the 25-technology global reference energy system.
#
# Source: model/energy/energy_model_world.gms in
# https://github.com/volker-krey/ntnu_iam_2024. Values transcribed as-is; no
# invented numbers.
#
# Two quirks in the source, kept here rather than smoothed over, since a
# reader comparing against the GAMS would otherwise read them as transcription
# bugs:
#   - fom.wind_ppl steps down to 20 in 2080 (half of every other year, 40) —
#     present in the GAMS TABLE as given, hence the per-year form below.
#   - cost_capacity carries an extra x1000 factor that simple_model.yaml does
#     not (see loader.py) — the GAMS comment explains why: inv is $/kW and
#     CAP_NEW is in PW here (petawatts), so x1000 brings the capacity-cost
#     term to the same order of magnitude ($bn) as the vom term, which is
#     $/MWh against ACT in PWh.
#
# Also worth knowing before reading this as "the" world model: there is no
# CO2 cap by default (cum_emiss_up is unset in the base run — see loader.py's
# `load_world(cum_emiss_up=...)` for the constrained scenario), and the
# resource-potential technologies (hydro_pot, wind_pot, solar_pot) carry no
# activity upper bound despite the name — the GAMS leaves their supply
# effectively unlimited. Both are exactly what the source does; wiring in
# real regional/resource limits is future work, not a bug here.

